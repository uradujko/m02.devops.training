version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: Prepare environment
          commands:
            - checkout
            - 'pip install pytest requests flask coverage locust '
            - cache store
      prologue:
        commands:
          - checkout
  - name: Run test
    dependencies:
      - Install Dependencies
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - cache restore
            - 'cd 1-tdd && python -m pytest test_factorial.py -v '
