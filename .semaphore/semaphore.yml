version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - 'export PATH=$PATH:/home/semaphore/.local/bin'
      - pip install pytest requests flask coverage locust
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: Prepare environment
          commands: []
      prologue:
        commands:
          - checkout
  - name: Run test
    dependencies:
      - Install Dependencies
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - 'cd 1-tdd && python -m pytest test_factorial.py -v '
