version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - sem-version python 3.12
      - checkout
      - 'export PATH=$PATH:/home/semaphore/.local/bin'
      - mkdir -p .pip_cache
      - cache restore
      - pip install --cache-dir .pip_cache -r requirements.txt
blocks:
  - name: Block 1
    dependencies: []
    task:
      jobs:
        - name: Install dependencies
          commands: []
  - name: Block 2
    dependencies:
      - Block 1
    task:
      jobs:
        - name: Unit tests
          commands:
            - cache store
            - cd 1-tdd
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - pytest test_factorial.py -v
            - pytest test_fibonacci.py -v
            - cd ..
            - cd 2-unit-testing
            - pytest test_math_sum.py -v
            - cd ..
  - name: Block 3
    dependencies:
      - Block 2
    task:
      jobs:
        - name: Integration tests
          commands:
            - cd 3-integration-testing
            - pytest test_integration.py -v
            - cd ..
            - cd 6-mocking
            - pytest test_weather_service.py -v
            - cd ..
            - cd 10-database-testing
            - pytest test_database.py -v
  - name: Block 4
    dependencies:
      - Block 3
    task:
      jobs:
        - name: End-to-end tests
          commands:
            - cd 4-e2e
            - pip install --cache-dir .pip_cache -r requirements.txt
            - cache store
            - nohup python app.py &
            - sleep 3
            - pytest test_e2e.py -v
            - cd ..
  - name: Block 5
    dependencies:
      - Block 4
    task:
      jobs:
        - name: Test coverage
          commands:
            - cd 7-test-coverage
            - coverage run -m pytest test_calculator.py -v
            - coverage report -m
            - cd ..
  - name: 'Block 6'
    dependencies:
      - Block 5
    task:
      jobs:
        - name: 'Performance testing'
          commands:
            - cd 8-performance-testing
            - nohup python -c "import sys; sys.path.insert(0, '../4-e2e'); from app import app; app.run()" &
            - sleep 3
            - locust -f locustfile.py --host=http://127.0.0.1:5000 --headless -u 10 -r 2 --run-time 30s
            - cd ..

  - name: 'Block 7'
    dependencies:
      - Block 6
    task:
      jobs:
        - name: 'Security tests'
          commands:
          - cd 9-security-testing
          - nohup python -c "import sys; sys.path.insert(0, '../4-e2e'); from app import app; app.run()" &
          - sleep 3
          - python -m pytest test_security.py -v
          - cd ..
  - name: Block 8
    dependencies:
      - Block 7
    task:
      jobs:
        - name: Test reporting
          commands:
            - cd 5-test-reports
            - pip install --cache-dir .pip_cache -r requirements.txt
            - pytest test_math_operations.py -v
            - pytest --junitxml=report.xml
            - '[[ -f report.xml ]] && test-results publish report.xml'

after_pipeline:
  task:
    jobs:
      - name: After pipeline job
        commands:
          - test-results gen-pipeline-report
