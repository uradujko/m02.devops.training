version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - 'export PATH=$PATH:/home/semaphore/.local/bin'
      - mkdir -p .pip_cache
      - cache restore
      - pip install --cache-dir .pip_cache -r requirements.txt
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: Prepare environment
          commands: []
  - name: Run test
    dependencies: []
    task:
      jobs:
        - name: 1-tdd
          commands:
            - cache store
            - cd 1-tdd
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - pytest test_factorial.py -v
            - pytest test_fibonacci.py -v
            - cd ..
  - name: Unit test
    dependencies: []
    task:
      jobs:
        - name: 2-unit-testing
          commands:
            - cd 2-unit-testing
            - pytest test_math_sum.py -v
            - cd ..
  - name: Integration testing
    dependencies: []
    task:
      jobs:
        - name: 3-integration-testing
          commands:
            - cd 3-integration-testing
            - pytest test_integration.py -v
            - cd ..
  - name: E2E
    dependencies:
      - Integration testing
    task:
      jobs:
        - name: 4-e2e run server
          commands:
            - cd 4-e2e
            - pip install --cache-dir .pip_cache -r requirements.txt
            - cache store
            - nohup python3.10 app.py &
            - sleep 3
            - pytest test_e2e.py -v
            - cd ..
